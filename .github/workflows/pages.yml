name: Deploy The Cozy Science Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Check and build the website
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the live Supabase connection
        env:
          VITE_BACKEND_MODE: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run backend:check -- --require-cloud
      - name: Check code and science content
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run validate:questions
          npm run sim:economy
          npm run backend:sql -- --check
      - name: Test database permissions and grading
        run: npm run backend:test
      - name: Check public science reading links
        run: npm run sources:check -- --online
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Select the installed Chromium
        run: >-
          node --input-type=module -e 'import { chromium } from "@playwright/test"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + chromium.executablePath() + "\n");'
      - name: Test the application
        run: npm run e2e
      - name: Test cloud authentication and records
        run: npm run e2e:cloud
      - name: Build and test the GitHub Pages URL
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run e2e:pages
      - name: Build the selected backend configuration
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BACKEND_MODE: supabase
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Upload the verified website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
