<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f6ed" />
    <meta
      name="description"
      content="A little curiosity, a little science, a lot of discovery. A cozy science learning lab for Grades 7–10."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/webp" href="/school-seal.webp" />
    <title>The Cozy Science Lab · A little wonder, every day</title>
    <meta property="og:site_name" content="The Cozy Science Lab" />
    <meta property="og:title" content="The Cozy Science Lab" />
    <style>
      .startup-screen {
        box-sizing: border-box;
        min-height: 95vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6ed;
        color: #29352d;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      .startup-card {
        box-sizing: border-box;
        width: 100%;
        max-width: 38rem;
        padding: clamp(24px, 6vw, 48px);
        border: 2px solid #29352d;
        border-radius: 24px;
        background: #fffdfa;
        box-shadow: 6px 6px 0 #d7ddc7;
      }
      .startup-card h1 {
        font-size: clamp(26px, 6vw, 36px);
        line-height: 1.2;
      }
      .startup-card a {
        color: #554184;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .startup-card a:focus-visible {
        outline: 3px solid #554184;
        outline-offset: 4px;
      }
      .startup-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }
      .startup-brand img {
        width: 60px;
        height: 60px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .startup-brand p {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <main
        id="main"
        class="startup-screen"
        tabindex="-1"
        aria-labelledby="startup-title"
      >
        <div class="startup-card">
          <div class="startup-brand">
            <img
              class="school-logo"
              src="/school-seal.webp"
              width="60"
              height="60"
              alt="Gun-ob High School seal, Lapu-Lapu City"
            />
            <p>The Cozy Science Lab</p>
          </div>
          <h1 id="startup-title">Getting your little lab ready…</h1>
          <p>A little wonder is on its way.</p>
          <p>
            If this screen stays here,
            <a
              href="https://julomjohnlouise19-cloud.github.io/SHEN-LOVE-EMU-HOUJO/"
              >open the online science lab</a
            >.
          </p>
          <p>A downloaded HTML file cannot run the full game on its own.</p>
          <p>The lab needs JavaScript enabled in your browser.</p>
        </div>
      </main>
    </div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
